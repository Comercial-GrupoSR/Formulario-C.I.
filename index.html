<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comunicação Interna - Grupo SR</title>
    <!-- Adicionado ?v=2 para forçar atualização do cache no celular -->
    <link rel="icon" href="favicon.ico?v=2" type="image/x-icon">
    <link rel="apple-touch-icon" href="icon-192.png">
    <!-- PWA: manifest e theme-color (necessários para o "Instalar app") -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#10543A">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CI Grupo SR">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Russo+One&display=swap" rel="stylesheet">
    <style>
        :root {
            --verde-escuro: #10543A;
            --verde-fundo-logo: #e8f5e9;
        }
       body {
    font-family: 'Montserrat', sans-serif;
    background-image: url('fundo.jpeg') !important;
    background-repeat: repeat !important;
    background-position: center center !important;
    background-size: 200px !important;
    background-color: transparent !important;
    margin: 0; padding: 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box;
}
        .form-container { background-color: #ffffff; width: 100%; max-width: 650px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); overflow: hidden; }
        .header-banner { background-color: var(--verde-fundo-logo); padding: 20px 15px; text-align: center; border-bottom: 4px solid var(--verde-escuro); }
        .header-banner img { max-width: 180px; height: auto; display: block; margin: 0 auto 10px auto; }
        .header-banner p { margin: 0; font-family: 'Russo One', sans-serif; font-size: 16px; color: var(--verde-escuro); letter-spacing: 1px; text-transform: uppercase; }
        .form-body { padding: 20px; }
        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
        .form-group { margin-bottom: 0; position: relative; }
        .full-width { grid-column: span 2; }
        label { display: block; margin-bottom: 4px; font-weight: 600; color: #333333; font-size: 12px; }
        label span { color: #de350b; margin-left: 2px; }
        input[type="text"], input[type="number"], input[type="date"], select, textarea, input[type="file"] {
            width: 100%; padding: 8px 10px; border: 1px solid #cccccc; border-radius: 5px; box-sizing: border-box; font-size: 13px; font-family: 'Montserrat', sans-serif; background-color: #fafafa; transition: all 0.2s;
        }
        .btn-generator { background-color: var(--verde-escuro); color: white; border: none; padding: 0 12px; border-radius: 5px; cursor: pointer; font-weight: 600; font-size: 12px; transition: all 0.2s; white-space: nowrap; }
        .btn-generator:disabled { background-color: #9e9e9e; cursor: not-allowed; opacity: 0.8; }
        .btn-submit { background-color: var(--verde-escuro); color: white; border: none; width: 100%; padding: 12px; border-radius: 5px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: 'Russo One', sans-serif; letter-spacing: 1px; transition: background-color 0.2s; margin-top: 15px; }
        .btn-submit:disabled { background-color: #9e9e9e; cursor: not-allowed; opacity: 0.8; }
        .loading { opacity: 0.6; pointer-events: none; }
        .aviso-numero { font-size: 11px; color: var(--verde-escuro); margin-top: 4px; display: none; }
        .aviso-anexos { font-size: 11px; color: #666; margin-top: 6px; }
        /* ---- Lista de anexos com remoção individual e somatório ---- */
        #drop-zone.drop-ativo { background-color: #e8f5e9; border-color: #0b3d2a; }
        .btn-escolher { background-color: var(--verde-escuro); color: white; border: none; padding: 8px 16px; border-radius: 5px; cursor: pointer; font-weight: 600; font-size: 13px; font-family: 'Montserrat', sans-serif; }
        .dica-arraste { font-size: 11px; color: #666; margin-top: 8px; }
        /* A lista fica DENTRO da área tracejada. Como aquela área é centralizada,
           os itens precisam voltar a alinhar à esquerda, e uma linha separadora
           marca onde termina o convite e começa o que já foi anexado. */
        #listaAnexos { list-style: none; margin: 0; padding: 0; text-align: left; }
        #listaAnexos:not(:empty) { margin-top: 14px; padding-top: 12px; border-top: 1px solid #cfe0d6; }
        .item-anexo { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: 1px solid #e0e0e0; border-radius: 4px; margin-bottom: 5px; background-color: #ffffff; font-size: 12px; }
        .nome-anexo { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .tamanho-anexo { color: #666; white-space: nowrap; font-variant-numeric: tabular-nums; }
        .btn-remover { background: none; border: none; color: #de350b; cursor: pointer; font-size: 15px; line-height: 1; padding: 2px 4px; border-radius: 3px; }
        .btn-remover:hover { background-color: #ffebe6; }
        #totalAnexos { font-size: 12px; font-weight: 600; color: var(--verde-escuro); }
        #totalAnexos:not(:empty) { margin-top: 8px; }
        #totalAnexos.excedeu { color: #de350b; }
        /* Botão de instalação do app */
        #btnInstalar {
            display: none;
            background-color: var(--verde-escuro);
            color: white;
            border: none;
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            margin-bottom: 12px;
        }
    </style>

<body>
<div class="form-container">
    <div class="header-banner">
        <img src="Grupo SR.png" alt="Grupo SR">
        <p>Comunicação Interna</p>
    </div>
    <div class="form-body" style="padding-bottom: 0;">
        <button type="button" id="btnInstalar">Instalar Aplicativo no Celular</button>
    </div>
    <form id="ciForm" class="form-body">
        <div class="form-grid">
            <div class="form-group full-width">
                <label>Nº Comunicação Interna <span>*</span></label>
                <div class="number-generator-group" style="display: flex; gap: 8px;">
                    <input type="text" id="numeroCI" name="numeroCI" placeholder="Gere o número ao lado" readonly required>
                    <button type="button" id="btnGerar" class="btn-generator" onclick="gerarNumero()">Gerar Número CI</button>
                </div>

            </div>
            <div class="form-group"><label>Ação da CI <span>*</span></label><select id="acao" name="acao" required><option value="" disabled selected>Escolha...</option><option value="Fabricação">Fabricação</option><option value="Requisição">Requisição</option><option value="Pintura">Pintura</option></select></div>
            <div class="form-group"><label>Responsável CI <span>*</span></label><select id="responsavel" name="responsavel" required><option value="" disabled selected>Escolha...</option><option value="Fernando Hendges Lopes">Fernando Hendges Lopes</option><option value="Marcos Malezan Tasquetto">Marcos Malezan Tasquetto</option><option value="Raphael Naeher">Raphael Naeher</option><option value="Ricardo Moreira">Ricardo Moreira</option><option value="Alan Renato Virago">Alan Renato Virago</option><option value="José Tomas">José Tomas</option><option value="Luis Filipe">Luis Filipe</option><option value="Eduardo Prado">Eduardo Prado</option><option value="Enrique Carvalho">Enrique Carvalho</option><option value="Henrique Moreira">Henrique Moreira</option><option value="Rafael Fagan">Rafael Fagan</option><option value="Leôncio Andrade">Leôncio Andrade</option><option value="Gabriel Lago">Gabriel Lago</option></select></div>
            <div class="form-group"><label>Destino da Comunicação <span>*</span></label><select id="destino" name="destino" required><option value="" disabled>Escolha...</option><option value="Almoxarifado">Almoxarifado</option><option value="Expedição">Expedição</option><option value="PCP" selected>PCP</option></select></div>
            <div class="form-group"><label>Data de Conclusão <span>*</span></label><input type="date" id="dataConclusao" name="dataConclusao" required></div>
            <div class="form-group full-width"><label>Nome Cliente <span>*</span></label><input type="text" id="nomeCliente" name="nomeCliente" placeholder="Nome do cliente" required></div>
            <div class="form-group"><label>Número Pedido <span>*</span></label><input type="number" id="numeroPedido" name="numeroPedido" placeholder="Nº do pedido" required></div>
            <div class="form-group"><label>Peso Líq. (kg) <span>*</span></label><input type="text" id="pesoLiquido" name="pesoLiquido" placeholder="Ex: 1500,50" required></div>
            <div class="form-group"><label>Localidade <span>*</span></label><input type="text" id="localidade" name="localidade" placeholder="Cidade/Estado" required></div>
            <div class="form-group"><label>Cor Interna <span>*</span></label><select id="corInterna" name="corInterna" required><option value="" disabled selected>Escolha a cor...</option><option value="N/A">N/A</option><option value="AMARELO RAL 1003">AMARELO RAL 1003</option><option value="AZUL 40360 EXR 53390">AZUL 40360 EXR 53390</option><option value="AZUL MUNSELL 3.30PB2.86/3.23">AZUL MUNSELL 3.30PB2.86/3.23</option><option value="AZUL MUNSELL 5B7/4">AZUL MUNSELL 5B7/4</option><option value="AZUL MUNSELL 6.35B6.99/4.98">AZUL MUNSELL 6.35B6.99/4.98</option><option value="AZUL RAL 5000">AZUL RAL 5000</option><option value="AZUL RAL 5009">AZUL RAL 5009</option><option value="AZUL RAL 5017">AZUL RAL 5017</option><option value="AZUL RAL 5019">AZUL RAL 5019</option><option value="AZUL SATAKE">AZUL SATAKE</option><option value="AZUL WEG 40517BR">AZUL WEG 40517BR</option><option value="BEGE MUNSELL 2.5Y6/2">BEGE MUNSELL 2.5Y6/2</option><option value="BEGE MUNSELL 5Y6/2">BEGE MUNSELL 5Y6/2</option><option value="BEGE MUNSELL 7.5Y8/2">BEGE MUNSELL 7.5Y8/2</option><option value="BEGE RAL 1001">BEGE RAL 1001</option><option value="BEGE RAL 1014">BEGE RAL 1014</option><option value="BRANCO RAL 9016">BRANCO RAL 9016</option><option value="BRANCO CALIFORNIA RAL 1013">BRANCO CALIFORNIA RAL 1013</option><option value="CINZA EXECUTIVO RAL 7021">CINZA EXECUTIVO RAL 7021</option><option value="CINZA RAL 7022">CINZA RAL 7022</option><option value="CINZA RAL 7035">CINZA RAL 7035</option><option value="CINZA RAL 7038">CINZA RAL 7038</option><option value="CINZA RAL 7039">CINZA RAL 7039</option><option value="LARANJA MUNSELL 2.5YR6/14">LARANJA MUNSELL 2.5YR6/14</option><option value="PRATA RAL 9006">PRATA RAL 9006</option><option value="PRETO RAL 9005 S/B">PRETO RAL 9005 S/B</option><option value="PRETO RAL 9017">PRETO RAL 9017</option><option value="VERDE EXR 53390">VERDE EXR 53390</option><option value="VERDE RAL 6002">VERDE RAL 6002</option><option value="VERDE RAL 6005">VERDE RAL 6005</option><option value="VERDE RAL 6011">VERDE RAL 6011</option><option value="VERDE RAL 6018">VERDE RAL 6018</option><option value="VERDE RAL 6027">VERDE RAL 6027</option><option value="VERMELHO RAL 3020">VERMELHO RAL 3020</option></select></div>
            <div class="form-group"><label>Almox <span>*</span></label><select id="almox" name="almox" required><option value="" disabled selected>Selecione...</option><option value="ELAB">ELAB</option><option value="EXP">EXP</option><option value="PM">PM</option></select></div>
            <div class="form-group"><label>Local de Aplicação do Item <span>*</span></label><select id="localAplicacao" name="localAplicacao" required><option value="" disabled selected>Selecione...</option><option value="Sede">Sede</option><option value="Bevilaqua">Bevilaqua</option><option value="Obra">Obra</option><option value="Particular/Doação">Particular/Doação</option></select></div>
            <div class="form-group full-width"><label>Código Item - Quantidade <span>*</span></label><input type="text" id="codigoQuantidade" name="codigoQuantidade" placeholder="Ex: Item XXXXX - 10UN" required></div>
            <div class="form-group full-width"><label>Diretório <span>*</span></label><input type="text" id="diretorio" name="diretorio" placeholder="Ex: Caminho ou pasta de referência" required></div>
            <div class="form-group full-width"><label>Motivo da Comunicação Interna <span>*</span></label><input type="text" id="motivo" name="motivo" placeholder="Motivo resumido" required></div>
            <div class="form-group full-width"><label>Observações</label><textarea id="observacoes" name="observacoes" rows="3" placeholder="Informações adicionais (opcional)"></textarea></div>
            <!-- Campo de Upload -->
            <div class="form-group full-width">
                <label>Anexar Arquivos (Arraste ou selecione múltiplos)</label>
                <div id="drop-zone" style="border: 2px dashed #10543A; padding: 20px; text-align: center; background-color: #f9f9f9; border-radius: 5px;">
                    <!-- O input fica oculto: quem manda na seleção é a lista abaixo.
                         Deixá-lo visível exibiria "Nenhum arquivo escolhido" logo acima
                         de uma lista com arquivos, porque a seleção nativa é limpa a
                         cada adição para permitir escolher o mesmo arquivo de novo. -->
                    <input type="file" id="arquivoAnexo" name="arquivos[]" multiple style="display: none;">
                    <button type="button" id="btnEscolherArquivos" class="btn-escolher">Selecionar arquivos</button>
                    <div class="dica-arraste">ou arraste os arquivos para esta área</div>
                    <ul id="listaAnexos"></ul>
                    <div id="totalAnexos"></div>
                </div>
                <div class="aviso-anexos">Limite total de 20 MB somando todos os arquivos.</div>
            </div>
        </div>
        <button type="submit" id="btnEnviar" class="btn-submit full-width">Enviar Comunicação Interna</button>
    </form>
</div>
<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyjMIMb8qC4ftq-hLHnPzMtP4ToMbOXlLxbRq0Sbp60Wskxh3EE57JgvYGu4eK-ZSLm/exec";

    // -----------------------------------------------------------------
    // Chave compartilhada (opcional). Deixe vazia para manter o
    // comportamento atual. Para ativar a proteção do Web App, cadastre a
    // property APP_KEY no Apps Script e repita o mesmo valor aqui.
    // -----------------------------------------------------------------
    const APP_KEY = "";

    // Limite total dos anexos: 20 MB. O base64 infla o arquivo em ~33% e tudo
    // viaja num único POST, então um envio grande estoura a cota do Apps Script.
    const LIMITE_ANEXOS_BYTES = 20 * 1024 * 1024;

    // -----------------------------------------------------------------
    // GERENCIAMENTO DOS ANEXOS
    // O <input type="file"> nativo não permite remover um arquivo: escolher
    // de novo SUBSTITUI a seleção inteira. Por isso a seleção real vive neste
    // array, e o input é apenas o meio de escolher. A cada adição o input é
    // limpo, o que também permite reescolher um arquivo que foi removido.
    // -----------------------------------------------------------------
    let arquivosSelecionados = [];

    const inputArquivos  = document.getElementById('arquivoAnexo');
    const btnEscolher    = document.getElementById('btnEscolherArquivos');
    const listaAnexosEl  = document.getElementById('listaAnexos');
    const totalAnexosEl  = document.getElementById('totalAnexos');
    const dropZone       = document.getElementById('drop-zone');

    function formatarTamanho(bytes) {
        if (bytes < 1024) return bytes + " B";
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
        return (bytes / 1024 / 1024).toFixed(2) + " MB";
    }

    // Identidade do arquivo, para não adicionar o mesmo duas vezes.
    function chaveArquivo(f) {
        return f.name + "|" + f.size + "|" + f.lastModified;
    }

    function totalBytesAnexos() {
        return arquivosSelecionados.reduce((soma, f) => soma + f.size, 0);
    }

    function adicionarArquivos(listaDeArquivos) {
        const novos = Array.from(listaDeArquivos || []);
        let repetidos = 0;

        novos.forEach(f => {
            if (arquivosSelecionados.some(a => chaveArquivo(a) === chaveArquivo(f))) {
                repetidos++;
                return;
            }
            arquivosSelecionados.push(f);
        });

        atualizarListaAnexos();

        if (repetidos) {
            alert(repetidos === 1
                ? "Um arquivo já estava na lista e não foi adicionado de novo."
                : repetidos + " arquivos já estavam na lista e não foram adicionados de novo.");
        }
    }

    function removerArquivo(indice) {
        arquivosSelecionados.splice(indice, 1);
        atualizarListaAnexos();
    }

    function limparAnexos() {
        arquivosSelecionados = [];
        atualizarListaAnexos();
    }

    function atualizarListaAnexos() {
        listaAnexosEl.innerHTML = "";

        arquivosSelecionados.forEach((arquivo, indice) => {
            const item = document.createElement('li');
            item.className = 'item-anexo';

            const nome = document.createElement('span');
            nome.className = 'nome-anexo';
            // textContent, e não innerHTML: nome de arquivo é dado do usuário.
            nome.textContent = arquivo.name;
            nome.title = arquivo.name;

            const tamanho = document.createElement('span');
            tamanho.className = 'tamanho-anexo';
            tamanho.textContent = formatarTamanho(arquivo.size);

            const botao = document.createElement('button');
            botao.type = 'button';
            botao.className = 'btn-remover';
            botao.textContent = '✕';
            botao.title = 'Remover este arquivo';
            botao.addEventListener('click', () => removerArquivo(indice));

            item.appendChild(nome);
            item.appendChild(tamanho);
            item.appendChild(botao);
            listaAnexosEl.appendChild(item);
        });

        const total = totalBytesAnexos();
        const limiteMb = (LIMITE_ANEXOS_BYTES / 1024 / 1024).toFixed(0);
        const excedeu = total > LIMITE_ANEXOS_BYTES;

        if (!arquivosSelecionados.length) {
            totalAnexosEl.textContent = "";
            totalAnexosEl.classList.remove('excedeu');
        } else {
            const plural = arquivosSelecionados.length === 1 ? "arquivo" : "arquivos";
            totalAnexosEl.textContent =
                arquivosSelecionados.length + " " + plural + " · " +
                formatarTamanho(total) + " de " + limiteMb + " MB" +
                (excedeu ? " — acima do limite, remova algum arquivo" : "");
            totalAnexosEl.classList.toggle('excedeu', excedeu);
        }

        // Bloqueia o envio enquanto estiver acima do limite.
        const btnEnviar = document.getElementById('btnEnviar');
        btnEnviar.disabled = excedeu;
    }

    btnEscolher.addEventListener('click', () => inputArquivos.click());

    inputArquivos.addEventListener('change', () => {
        adicionarArquivos(inputArquivos.files);
        // Limpa a seleção nativa para que o mesmo arquivo possa ser escolhido
        // de novo depois de removido da lista.
        inputArquivos.value = "";
    });

    ['dragenter', 'dragover'].forEach(evento => {
        dropZone.addEventListener(evento, e => {
            e.preventDefault();
            dropZone.classList.add('drop-ativo');
        });
    });

    ['dragleave', 'drop'].forEach(evento => {
        dropZone.addEventListener(evento, e => {
            e.preventDefault();
            dropZone.classList.remove('drop-ativo');
        });
    });

    dropZone.addEventListener('drop', e => {
        if (e.dataTransfer && e.dataTransfer.files) {
            adicionarArquivos(e.dataTransfer.files);
        }
    });

    // -----------------------------------------------------------------
    // [CORREÇÃO] Antes o FileReader não tratava onerror. Se a leitura falhasse
    // (arquivo removido do pendrive, permissão negada, arquivo corrompido), a
    // Promise nunca resolvia nem rejeitava: o await ficava preso para sempre,
    // o finally nunca rodava e o botão travava em "Processando...", com um
    // número de CI já reservado no servidor.
    // -----------------------------------------------------------------
    async function filesToBase64() {
        const files = arquivosSelecionados;
        if (!files.length) return [];

        // Conferência final no envio. A lista já bloqueia o botão, mas esta
        // trava cobre o caso de alguém reabilitar o botão pelo navegador.
        const total = files.reduce((soma, f) => soma + f.size, 0);
        if (total > LIMITE_ANEXOS_BYTES) {
            const mb = (total / 1024 / 1024).toFixed(1);
            const limiteMb = (LIMITE_ANEXOS_BYTES / 1024 / 1024).toFixed(0);
            throw new Error(
                "Os anexos somam " + mb + " MB e o limite é " + limiteMb + " MB. " +
                "Remova ou compacte alguns arquivos e tente novamente."
            );
        }

        const filesData = [];
        for (const file of files) {
            const base64 = await new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload  = () => resolve(String(reader.result).split(',')[1]);
                reader.onerror = () => reject(new Error('Falha ao ler o arquivo "' + file.name + '".'));
                reader.onabort = () => reject(new Error('Leitura do arquivo "' + file.name + '" foi cancelada.'));
                reader.readAsDataURL(file);
            });
            filesData.push({ name: file.name, data: base64, type: file.type });
        }
        return filesData;
    }

    document.getElementById('ciForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const form = document.getElementById('ciForm');
        if (!form.checkValidity()) {
            form.reportValidity();
            return;
        }

        const btnSubmit = document.getElementById('btnEnviar');

        // -----------------------------------------------------------------
        // TRAVA CONTRA DUPLO CLIQUE
        // O botão é desabilitado assim que o envio começa e só volta no
        // finally, cobrindo sucesso e erro. Isso não substitui a validação de
        // duplicidade no backend, mas fecha a causa mais comum de card
        // duplicado: o clique de impaciência enquanto o servidor processa.
        // -----------------------------------------------------------------
        if (btnSubmit.disabled) return;

        btnSubmit.disabled = true;
        btnSubmit.innerText = "Processando arquivos e enviando...";

        // [CORREÇÃO] A leitura dos arquivos agora está DENTRO do try/finally.
        // Antes ela ficava fora, então uma falha ali deixava o botão travado.
        try {
            const arquivos = await filesToBase64();

            const formData = {
                appKey: APP_KEY,
                numeroCI: document.getElementById('numeroCI').value,
                acao: document.getElementById('acao').value,
                responsavel: document.getElementById('responsavel').value,
                destino: document.getElementById('destino').value,
                codigoQuantidade: document.getElementById('codigoQuantidade').value,
                diretorio: document.getElementById('diretorio').value,
                nomeCliente: document.getElementById('nomeCliente').value,
                numeroPedido: document.getElementById('numeroPedido').value,
                localidade: document.getElementById('localidade').value,
                corInterna: document.getElementById('corInterna').value,
                // [CORREÇÃO CRÍTICA] O peso vai CRU, sem replace. Antes o front
                // trocava a primeira vírgula por ponto e o backend fazia o mesmo
                // de novo — "1.500,50" virava "1.500.50" e o parseFloat devolvia
                // 1.5, transformando 1500 kg em 1,5 kg no PDF e no card.
                // A normalização agora acontece só no backend, uma única vez.
                pesoLiquido: document.getElementById('pesoLiquido').value,
                almox: document.getElementById('almox').value,
                localAplicacao: document.getElementById('localAplicacao').value,
                motivo: document.getElementById('motivo').value,
                observacoes: document.getElementById('observacoes').value,
                dataConclusao: document.getElementById('dataConclusao').value,
                arquivos: arquivos
            };

            const response = await fetch(WEB_APP_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(formData)
            });

            const resultado = await response.json();

            if (resultado.success) {
                alert("CI Nº " + resultado.numeroGerado + " enviada com sucesso!");
                form.reset();
                liberarBotaoGerar();
            } else {
                // [CORREÇÃO] Mostra o motivo real em vez de "Erro:" genérico.
                alert("Erro ao enviar a CI:\n\n" + (resultado.error || "Motivo não informado pelo servidor."));
            }

        } catch (error) {
            console.error(error);
            // [CORREÇÃO] Antes era sempre "Erro ao enviar.", escondendo a causa.
            alert("Erro ao enviar a CI:\n\n" + (error && error.message ? error.message : error) +
                  "\n\nO número da CI continua reservado — corrija o problema e envie novamente sem gerar outro número.");
        } finally {
            btnSubmit.disabled = false;
            btnSubmit.innerText = "Enviar Comunicação Interna";
            // Reaplica o estado do botão: se ainda houver anexos acima do
            // limite, ele volta a ficar bloqueado.
            atualizarListaAnexos();
        }
    });

    document.getElementById('ciForm').addEventListener('reset', function() {
        liberarBotaoGerar();
        // O form.reset() limpa o input nativo, mas não o nosso array.
        limparAnexos();
    });

    function liberarBotaoGerar() {
        const btnGerar = document.getElementById('btnGerar');
        const inputNumero = document.getElementById('numeroCI');
        const aviso = document.getElementById('avisoNumero');
        btnGerar.disabled = false;
        btnGerar.innerText = "Gerar Número CI";
        inputNumero.value = "";
        aviso.style.display = "none";
    }

    async function gerarNumero() {
        const btnGerar = document.getElementById('btnGerar');
        const inputNumero = document.getElementById('numeroCI');
        const aviso = document.getElementById('avisoNumero');

        btnGerar.disabled = true;
        btnGerar.innerText = "Gerando...";

        try {
            const url = WEB_APP_URL + "?action=getSequence" +
                        (APP_KEY ? "&appKey=" + encodeURIComponent(APP_KEY) : "");
            const response = await fetch(url);
            const resultado = await response.json();

            if (resultado.numero) {
                inputNumero.value = resultado.numero;
                // Número já reservado no servidor: mantém o botão bloqueado para
                // impedir clique duplo ou geração de um segundo número antes de
                // enviar/limpar o formulário.
                btnGerar.innerText = "Número Gerado ✓";
                aviso.style.display = "block";
            } else {
                alert(resultado.error || "Não foi possível gerar o número. Tente novamente.");
                btnGerar.disabled = false;
                btnGerar.innerText = "Gerar Número CI";
            }
        } catch (error) {
            console.error(error);
            alert("Erro ao gerar número. Verifique sua conexão.");
            btnGerar.disabled = false;
            btnGerar.innerText = "Gerar Número CI";
        }
    }

    // --- PWA: registro do Service Worker ---
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('Service Worker registrado:', reg.scope))
                .catch(err => console.error('Falha ao registrar Service Worker:', err));
        });
    }

    // --- PWA: botão de instalação (Android/Chrome) ---
    let deferredPrompt;
    const btnInstalar = document.getElementById('btnInstalar');
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        btnInstalar.style.display = 'block';
    });
    btnInstalar.addEventListener('click', async () => {
        if (!deferredPrompt) return;
        btnInstalar.style.display = 'none';
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
    });
    window.addEventListener('appinstalled', () => {
        btnInstalar.style.display = 'none';
    });
</script>
</body>
</html>
